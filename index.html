<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rehearse</title>
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#141414;--fg:#eee;--dim:#888;--acc:#e8b04a;--card:#1f1f1f;--line:#2c2c2c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
header b{flex:1;font-weight:600;letter-spacing:.02em}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
button.acc{background:var(--acc);color:#111;border:none;font-weight:600}
.view{flex:1;overflow:auto;padding:14px;display:none}
.view.on{display:flex;flex-direction:column;gap:12px}
textarea{width:100%;min-height:42vh;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:15px/1.4 ui-monospace,monospace}
select,input[type=range]{width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
label{font-size:14px;color:var(--dim);display:block;margin-bottom:4px}
.hint{font-size:13px;color:var(--dim)}
.row{display:flex;gap:10px}.row>*{flex:1}
#run.on{overflow:hidden}
#stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:safe center;gap:18px;padding:4px 2px}
#controls{flex:none;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.who{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.cue{font-size:18px;color:var(--dim)}
.mine{font-size:calc(clamp(26px,3vw,52px)*var(--mineScale,1));line-height:1.3;white-space:pre-line}
.prog{font-size:13px;color:var(--dim);text-align:center;padding:6px}
#go{font-size:22px;padding:22px;border-radius:16px;width:100%}
.ctl{display:flex;gap:6px}.ctl button{flex:1;padding:10px 4px;font-size:15px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.speaking{color:var(--acc)!important}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
#mark{font-size:14px;padding:7px 12px;border-radius:999px;color:var(--dim);-webkit-user-select:none;user-select:none}
#mark.on{background:#2f8f5b;border-color:#2f8f5b;color:#fff;font-weight:600}
#pos{font-size:13px;color:var(--dim)}
.libhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#scenes{display:flex;flex-direction:column;gap:6px}
.sc{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.sc small{color:var(--dim);font-size:13px;white-space:nowrap}
.sc.cur{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
input#sname{width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
#delScene.arm{background:#8f2f2f;border-color:#8f2f2f}
/* Recording mode, only when the page is served by takecheck on the Mac */
.tk{display:none}body.tkmode .tk{display:revert}body.tkmode .notk{display:none!important}
#recDot{font-size:13px;color:var(--dim);white-space:nowrap}#recDot.on{color:#e5484d}
#finishBox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
#finishBox.on{display:flex}
#finishBox .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
#finishBox input{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
#finishMsg a{color:var(--acc)}
</style>
</head>
<body>

<section class="view" id="setup">
  <div>
    <div class="libhead"><b>Scenes</b><button id="importBtn" class="notk">Import scene</button><span class="tk hint">From takecheck's scripts folder</span></div>
    <input type="file" id="imp" accept=".json,.txt,application/json,text/plain" multiple style="display:none">
    <div id="scenes"></div>
    <div class="hint" id="libInfo"></div>
  </div>
  <div><label>Scene name</label><input id="sname" autocomplete="off"></div>
  <div>
    <label>Script — one line per speech, <code>NAME: text</code>. (Stage directions) aren't spoken.</label>
    <textarea id="src" placeholder="CALLIE: Hi, are you Mrs. Winsley?&#10;MRS. WINSLEY: I am. Come in.&#10;CALLIE: (sitting) Thank you."></textarea>
    <div class="hint" id="audioInfo"></div>
  </div>
  <div class="row">
    <div><label>I play</label><select id="me"></select></div>
    <div><label>Phone voice, for lines with no recording</label><select id="voice"></select></div>
  </div>
  <div><label>Size of your lines <span id="sizeV"></span></label><input type="range" id="size" min="0.8" max="1.8" step="0.1" value="1"></div>
  <div><label>Speed <span id="rateV"></span></label><input type="range" id="rate" min="0.7" max="1.5" step="0.05" value="1"></div>
  <div class="tk"><label>Microphone</label><select id="micSel"></select></div>
  <div class="row notk"><button id="newScene">New scene</button><button id="delScene">Delete scene</button></div>
  <div class="hint" id="midiInfo"></div>
  <button class="acc" id="start">Play</button>
</section>

<section class="view on" id="run">
  <div id="bar"><button id="mark">○ Set start here</button><span id="pos"></span><span id="recDot" class="tk">● REC</span><button id="finish" class="tk">Finish</button></div>
  <div id="stage">
    <div><div class="who" id="cueWho"></div><div class="cue" id="cue"></div></div>
    <div><div class="who" id="myWho"></div><div class="mine" id="mine"></div></div>
  </div>
  <div id="controls">
    <button class="acc" id="go">Play</button>
    <div class="ctl"><button id="back">Back</button><button id="again">Replay</button><button id="fwd">Forward</button><button id="stop">Stop</button></div>
  </div>
</section>

<div id="finishBox"><div class="panel">
  <b>End of run</b>
  <div class="hint" id="finishInfo"></div>
  <div><label>Label for this take</label><input id="takeLabel" value="run" autocomplete="off"></div>
  <div class="row"><button class="acc" id="analyse">Analyse</button><button id="discard">Discard</button></div>
  <button id="keepGoing">Keep going</button>
  <div class="hint" id="finishMsg"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lines=[],beats=[],idx=0,played=false,player=null;
let scenes=[],cur=null,urls={};

// ---- Scene library, kept in the phone's browser storage (IndexedDB) ----
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('rehearse',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('scenes',{keyPath:'id'});
    r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(mode,fn){return new Promise((res,rej)=>{const t=DB.db.transaction('scenes',mode);const st=t.objectStore('scenes');const r=fn(st);
    t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  all(){return DB.tx('readonly',st=>st.getAll())},
  put(sc){return DB.tx('readwrite',st=>st.put(sc))},
  del(id){return DB.tx('readwrite',st=>st.delete(id))}};
let saveT=null;
function save(){ if(!cur) return; cur.updated=Date.now(); clearTimeout(saveT); saveT=setTimeout(()=>DB.put(cur).catch(()=>{}),400); }
function lineKey(l){return l.who+'|'+speakable(l.text).toLowerCase()}
function audioFor(l){ if(!cur||!cur.audio) return null; const k=lineKey(l); const b=cur.audio[k]; if(!b) return null; return urls[k]||(urls[k]=URL.createObjectURL(b)); }

// The start mark: one beat per scene, like a radio button. Hold Forward to jump to it.
function getMark(){const n=cur&&cur.mark!=null?+cur.mark:-1;return n>=0&&n<beats.length?n:-1}
function setMark(n){ if(!cur) return; cur.mark=n; save(); }

function parse(t){
  const out=[];
  t.split(/\r?\n/).forEach(r=>{
    r=r.trim(); if(!r) return;
    const m=r.match(/^([A-Z][A-Za-z .'\-]{0,30}):\s*(.*)$/);
    if(m) out.push({who:m[1].trim().toUpperCase(),text:m[2]});
    else if(out.length) out[out.length-1].text+=' '+r;
  });
  return out;
}
function speakable(t){return t.replace(/\([^)]*\)|\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim()}

function refreshChars(){
  lines=parse($('src').value);
  const chars=[...new Set(lines.map(l=>l.who))];
  const prev=(cur&&cur.me)||$('me').value;
  $('me').innerHTML=chars.map(c=>`<option${c===prev?' selected':''}>${c}</option>`).join('');
}
function loadVoices(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  vs.sort((a,b)=>(b.lang==='en-US')-(a.lang==='en-US'));
  const prev=store.get('voice');
  $('voice').innerHTML=vs.map(v=>`<option value="${v.name}"${v.name===prev?' selected':''}>${v.name} (${v.lang})${v.localService?'':' ☁'}</option>`).join('')||'<option>default</option>';
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}

// Beats: each beat = partner lines (cue) followed by my lines
function buildBeats(){
  const me=$('me').value; beats=[]; let cur={cue:[],mine:[]}; let pIdx=0;
  lines.forEach(l=>{
    if(l.who===me){cur.mine.push(l)}
    else{ if(cur.mine.length){beats.push(cur);cur={cue:[],mine:[]}} cur.cue.push({...l,a:pIdx++}) }
  });
  if(cur.cue.length||cur.mine.length) beats.push(cur);
}

let run=0, watch=null;
// Stop everything and invalidate any line still queued, so nothing plays late.
function stop(){if(window.tkClose)tkClose(); run++; clearTimeout(watch); try{speechSynthesis.cancel()}catch(e){} $('cue').classList.remove('speaking'); if(player){player.pause();player.src='';player=null}}
// Leaving the page (another app, screen off) must release the audio at once:
// Android's voice engine can jam for every app if it is cut off mid-sentence.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stop();
  else { try{speechSynthesis.cancel(); speechSynthesis.getVoices()}catch(e){} }  // nudge the engine awake on return
});
window.addEventListener('pagehide',stop);
// Speak one line. If the voice engine is still busy or never starts, reset it and
// try once more; if it still won't start, say so instead of staying silent.
function say(text,onDone,tries=2){
  const myRun=run;
  const go=()=>{
    if(myRun!==run) return;
    try{speechSynthesis.resume()}catch(e){}
    const u=new SpeechSynthesisUtterance(text);
    const v=speechSynthesis.getVoices().find(v=>v.name===$('voice').value); if(v){u.voice=v;u.lang=v.lang}
    u.rate=Math.min(2,1.2*+$('rate').value);  // as fast as the recordings
    let started=false;
    u.onstart=u.onboundary=()=>{started=true; clearTimeout(watch)};
    u.onend=u.onerror=()=>{ clearTimeout(watch); if(myRun===run) onDone(); };
    speechSynthesis.speak(u);
    watch=setTimeout(()=>{
      if(started||myRun!==run) return;
      // Some Android versions never report the start; if the engine says it is speaking, leave it alone.
      let sp=false; try{sp=speechSynthesis.speaking}catch(e){}
      if(sp) return;
      try{speechSynthesis.cancel()}catch(e){}
      if(tries>1) setTimeout(()=>say(text,onDone,tries-1),300);
      else { $('cue').classList.remove('speaking'); $('cue').textContent='The phone voice did not start. Tap Replay. If it stays silent, force-stop "Speech Services by Google" in Android Settings > Apps.'; }
    },2500);
  };
  let busy=false; try{busy=speechSynthesis.speaking||speechSynthesis.pending}catch(e){}
  if(busy){try{speechSynthesis.cancel()}catch(e){} setTimeout(go,250)} else go();
}
function playCue(b){
  stop(); const q=[...b.cue]; const el=$('cue'); const myRun=run;
  const next=()=>{
    if(myRun!==run) return;
    if(!q.length){el.classList.remove('speaking'); if(window.tkOpen)tkOpen(b); return}
    const l=q.shift(); el.classList.add('speaking');
    const url=audioFor(l);
    if(url){const myRun=run;player=new Audio(url);player.preservesPitch=true;player.playbackRate=+$('rate').value;
      player.onended=player.onerror=()=>{if(myRun===run)next()};
      player.play().catch(()=>{ if(myRun===run){player=null;say(speakable(l.text),next)} });}
    else say(speakable(l.text),next);
  };
  next();
}
function render(i=idx){
  const b=beats[i];
  $('stage').scrollTop=0;
  const m=getMark(), on=b&&m===i;
  $('mark').classList.toggle('on',on);
  $('mark').textContent=on?'● Start':'○ Set start here';
  $('pos').textContent=beats.length?`${Math.min(i,beats.length-1)+1} / ${beats.length}`+(m>=0&&!on?` · start at ${m+1}`:''):'';
  if(!b){$('cueWho').textContent='';$('cue').textContent='';$('myWho').textContent='';$('mine').textContent='';return}
  $('cueWho').textContent=b.cue.length?b.cue.map(c=>c.who).filter((x,i,a)=>a.indexOf(x)===i).join(' / '):'(you open)';
  $('cue').textContent=b.cue.map(c=>c.text).join(' — ')||'—';
  $('myWho').textContent=b.mine.length?$('me').value:'';
  $('mine').textContent=b.mine.map(m=>m.text).join('\n\n');

}
function step(){ stop(); if(played) idx++; if(idx>=beats.length) idx=0; render(); if(beats[idx]) playCue(beats[idx]); played=true; }

$('go').onclick=()=>{ if(!beats.length){show('setup');return} step(); };
$('again').onclick=()=>{ if(beats[idx]){playCue(beats[idx]);played=true} };
$('back').onclick=()=>{ stop(); idx=Math.max(0,idx-1); played=false; render(); };

$('src').oninput=()=>{ if(!cur) return; cur.src=$('src').value; save(); refreshChars(); renderLib(); audioInfo(); };
$('sname').oninput=()=>{ if(!cur) return; cur.name=$('sname').value; save(); renderLib(); };
$('me').onchange=()=>{ if(cur){cur.me=$('me').value;save()} audioInfo(); };
$('voice').onchange=()=>store.set('voice',$('voice').value);
$('rate').oninput=()=>{$('rateV').textContent='×'+$('rate').value;store.set('rate',$('rate').value)};
function show(v){stop();$('setup').classList.toggle('on',v==='setup');$('run').classList.toggle('on',v==='run');awake()}
// Keep the screen on while the rehearsal screen is open. MIDI keys don't count as
// activity for the computer, so without this the display goes dark mid-scene.
let wake=null;
async function awake(){
  const want=$('run').classList.contains('on')&&!document.hidden;
  try{
    if(want&&!wake&&navigator.wakeLock){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null}); }
    else if(!want&&wake){ const w=wake; wake=null; await w.release(); }
  }catch(e){ wake=null; }
}
document.addEventListener('visibilitychange',awake);
$('fwd').onclick=()=>{ stop(); idx=Math.min(beats.length-1,idx+1); played=false; render(); };
$('stop').onclick=()=>stop();
function hold(id,fn){const el=$(id);let t,fired=false;
  el.addEventListener('pointerdown',()=>{fired=false;t=setTimeout(()=>{fired=true;fn()},800)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(t)));
  el.addEventListener('click',e=>{if(fired){e.stopImmediatePropagation();fired=false}},true);
  el.oncontextmenu=e=>e.preventDefault();}
hold('stop',()=>show('setup'));
hold('back',()=>{stop();idx=0;played=false;render();});
hold('fwd',()=>{stop();const m=getMark();idx=m>=0?m:0;played=false;render();});
$('mark').onclick=()=>{ if(!beats[idx]) return; setMark(getMark()===idx?-1:idx); render(); };
$('start').onclick=()=>{ if(!cur) return; refreshChars();buildBeats();idx=0;played=false;show('run');render();step();};

// ---- Library screen ----
function fmtMB(n){return n>=1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB'}
function sceneSize(sc){let n=(sc.src||'').length;for(const k in (sc.audio||{}))n+=sc.audio[k].size||0;return n}
function renderLib(){
  const box=$('scenes'); box.textContent='';
  [...scenes].sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(sc=>{
    const b=document.createElement('button'); b.className='sc'+(sc===cur?' cur':'');
    const n=Object.keys(sc.audio||{}).length;
    const name=document.createElement('span'); name.textContent=sc.name||'Untitled';
    const info=document.createElement('small'); info.textContent=(n?'voice ✓ · ':'')+fmtMB(sceneSize(sc));
    b.append(name,info); b.onclick=()=>select(sc); box.append(b);
  });
  if(!scenes.length) box.innerHTML='<div class="hint">No scenes yet. Import one, or tap New scene and paste it.</div>';
  if(navigator.storage&&navigator.storage.estimate) navigator.storage.estimate().then(e=>{$('libInfo').textContent=`${scenes.length} scene${scenes.length===1?'':'s'}, ${fmtMB(e.usage||0)} used on this phone.`}).catch(()=>{});
}
function audioInfo(){
  if(!cur){$('audioInfo').textContent='';return}
  const me=$('me').value, partner=lines.filter(l=>l.who!==me&&speakable(l.text));
  const have=partner.filter(l=>cur.audio&&cur.audio[lineKey(l)]).length;
  $('audioInfo').textContent=!partner.length?'':have===partner.length?`Recorded voice for all ${have} partner lines.`
    :have?`Recorded voice for ${have} of ${partner.length} partner lines; the phone voice reads the rest.`:'No recordings: the phone voice reads the lines.';
}
function select(sc){
  stop(); Object.values(urls).forEach(URL.revokeObjectURL); urls={};
  cur=sc; store.set('cur',sc?sc.id:'');
  $('src').value=sc?sc.src||'':''; $('sname').value=sc?sc.name||'':'';
  refreshChars(); buildBeats(); idx=0; played=false; render(); renderLib(); audioInfo();
}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
$('newScene').onclick=async()=>{const sc={id:newId(),name:'New scene',src:'',me:'',mark:-1,audio:{},updated:Date.now()};scenes.push(sc);await DB.put(sc).catch(()=>{});select(sc);$('sname').focus();$('sname').select();};
let delArmed=null;
$('delScene').onclick=async()=>{
  if(!cur) return;
  if(!delArmed){$('delScene').classList.add('arm');$('delScene').textContent='Tap again to delete';delArmed=setTimeout(()=>{delArmed=null;$('delScene').classList.remove('arm');$('delScene').textContent='Delete scene'},3000);return}
  clearTimeout(delArmed);delArmed=null;$('delScene').classList.remove('arm');$('delScene').textContent='Delete scene';
  await DB.del(cur.id).catch(()=>{}); scenes=scenes.filter(x=>x!==cur); select(scenes[0]||null);
};
$('importBtn').onclick=()=>$('imp').click();
function dataUrlToBlob(u){const i=u.indexOf(',');const meta=u.slice(5,i);const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return new Blob([a],{type:meta.split(';')[0]||'audio/mp4'})}
$('imp').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; let last=null, msg=[];
  for(const f of files){
    try{
      const text=await f.text(); let sc;
      if(/\.json$/i.test(f.name)||text.trim().startsWith('{')){
        const j=JSON.parse(text); if(j.format!=='rehearse-scene') throw new Error('not a Rehearse scene file');
        const audio={}; for(const k in (j.audio||{})) audio[k]=dataUrlToBlob(j.audio[k]);
        sc={name:j.name||f.name.replace(/\.rehearse\.json$|\.json$/i,''),src:j.script||'',audio};
      } else sc={name:f.name.replace(/\.txt$/i,''),src:text,audio:{}};
      // Same name as an existing scene: replace its script and voice, keep my role and start mark.
      const old=scenes.find(x=>(x.name||'')===sc.name);
      const rec=old?Object.assign(old,{src:sc.src,audio:sc.audio}):Object.assign({id:newId(),me:'',mark:-1},sc);
      rec.updated=Date.now(); if(!old) scenes.push(rec);
      await DB.put(rec); last=rec; msg.push(sc.name+(Object.keys(sc.audio).length?' (with voice)':''));
    }catch(err){ msg.push(f.name+': '+(err.name==='QuotaExceededError'?'phone storage is full':err.message)); }
  }
  if(last) select(last);
  $('libInfo').textContent='Imported: '+msg.join(', ');
  setTimeout(renderLib,4000);
};

// ---- Recording mode: only when served by `takecheck rehearse` on the Mac ----
// The microphone records one continuous stream for the whole run; the page notes,
// on the same audio clock, when each of your replies begins (her cue has ended)
// and ends (you moved on). takecheck cuts the replies out afterwards.
const TK=!!window.TAKECHECK;
let rec=null, pendingOpen=null;
if(TK){
  document.body.classList.add('tkmode');
  const tkNow=()=>rec&&rec.f0!=null?Math.round(rec.ctx.currentTime*rec.ctx.sampleRate)-rec.f0:0;
  window.tkOpen=b=>{
    if(!b||!b.mine.length) return;
    const w={beat:beats.indexOf(b),cue:b.cue.map(l=>({who:l.who,text:l.text})),mine:b.mine.map(l=>({who:l.who,text:l.text}))};
    if(!rec||rec.f0==null){pendingOpen=w;return}
    w.start=tkNow(); rec.open=w;
  };
  window.tkClose=()=>{
    pendingOpen=null;
    if(!rec||!rec.open) return;
    const w=rec.open; rec.open=null; w.end=tkNow();
    if(w.end-w.start>0.3*rec.ctx.sampleRate) rec.windows[w.beat]=w;  // the last go at a reply wins
  };
  async function micList(){
    try{
      const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
      const want=store.get('micId');
      $('micSel').innerHTML=ds.map(d=>`<option value="${d.deviceId}"${d.deviceId===want?' selected':''}>${(d.label||'Microphone').replace(/</g,'&lt;')}</option>`).join('');
      if(!want){const q=ds.find(d=>/q2u|samson/i.test(d.label)); if(q){$('micSel').value=q.deviceId}}
    }catch(e){}
  }
  $('micSel').onchange=()=>{store.set('micId',$('micSel').value); if(rec&&!rec.windowsCount()){micStop()}};
  async function micStart(){
    const id=$('micSel').value;
    const stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id?{exact:id}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ctx=new AudioContext();
    const code="class R extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage({f:currentFrame,d:c.slice(0)});return true}}registerProcessor('rec',R)";
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));
    const src=ctx.createMediaStreamSource(stream), node=new AudioWorkletNode(ctx,'rec'), mute=ctx.createGain(); mute.gain.value=0;
    src.connect(node); node.connect(mute); mute.connect(ctx.destination);
    rec={ctx,stream,node,chunks:[],f0:null,open:null,windows:{},windowsCount(){return Object.keys(this.windows).length}};
    node.port.onmessage=e=>{ if(rec.f0==null){rec.f0=e.data.f; if(pendingOpen){const w=pendingOpen;pendingOpen=null;w.start=0;rec.open=w}} rec.chunks.push(e.data.d); };
    $('recDot').classList.add('on'); micList();
  }
  function micStop(){ if(!rec) return; try{rec.stream.getTracks().forEach(t=>t.stop());rec.ctx.close()}catch(e){} rec=null; $('recDot').classList.remove('on'); }
  // Recording begins with the first Play of a run.
  const plainStep=step;
  step=function(){ if(!rec){ micStart().catch(err=>{$('cue').textContent='Microphone not available: '+err.message}); } plainStep(); };
  $('go').onclick=()=>{ if(!beats.length){show('setup');return} step(); };
  $('start').onclick=()=>{ if(!cur) return; refreshChars();buildBeats();idx=0;played=false;show('run');render();step(); };
  setInterval(()=>{ if(rec&&rec.f0!=null){const t=Math.floor(tkNow()/rec.ctx.sampleRate);$('recDot').textContent=`● REC ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')} · ${rec.windowsCount()} repl${rec.windowsCount()===1?'y':'ies'}`} else $('recDot').textContent='● REC'; },500);
  function wavOf(r){
    const n=r.chunks.reduce((a,c)=>a+c.length,0), buf=new ArrayBuffer(44+n*2), v=new DataView(buf), sr=r.ctx.sampleRate;
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    let o=44; for(const c of r.chunks) for(let i=0;i<c.length;i++){const x=Math.max(-1,Math.min(1,c[i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
    return new Blob([buf],{type:'audio/wav'});
  }
  $('finish').onclick=()=>{
    stop();
    const n=rec?rec.windowsCount():0;
    $('finishInfo').textContent=n?`${n} repl${n===1?'y':'ies'} recorded.`:'No reply recorded yet.';
    $('analyse').disabled=!n; $('finishMsg').textContent=''; $('finishBox').classList.add('on');
  };
  $('keepGoing').onclick=()=>$('finishBox').classList.remove('on');
  $('discard').onclick=()=>{ micStop(); $('finishBox').classList.remove('on'); };
  $('analyse').onclick=async()=>{
    if(!rec) return;
    const r=rec; micStop();
    $('analyse').disabled=true; $('finishMsg').textContent='Analysing… this takes about a minute.';
    const meta={scene:cur?cur.name:'scene',me:$('me').value,label:$('takeLabel').value||'run',sampleRate:r.ctx.sampleRate,
      windows:Object.values(r.windows).sort((a,b)=>a.beat-b.beat)};
    const fd=new FormData(); fd.append('meta',JSON.stringify(meta)); fd.append('audio',wavOf(r),'run.wav');
    try{
      const res=await fetch('/api/run',{method:'POST',body:fd}); const j=await res.json();
      if(!res.ok) throw new Error(j.error||res.statusText);
      $('finishMsg').innerHTML='';
      const a=document.createElement('a'); a.href=j.report; a.target='_blank'; a.textContent='Open the report';
      $('finishMsg').append(j.summary+' ',a);
    }catch(err){ $('finishMsg').textContent='Analysis failed: '+err.message; }
  };
  // Scenes come from takecheck's scripts folder. Each one replaces the stored scene of
  // the same name, keeping your role and start mark.
  window.tkLoadScenes=async()=>{
    try{
      const names=await (await fetch('/api/scenes')).json();
      for(const name of names){
        const j=await (await fetch('/api/scene?name='+encodeURIComponent(name))).json();
        const audio={}; for(const k in (j.audio||{})) audio[k]=dataUrlToBlob(j.audio[k]);
        const old=scenes.find(x=>(x.name||'')===j.name);
        const rec2=old?Object.assign(old,{src:j.script,audio}):{id:newId(),name:j.name,src:j.script,me:'',mark:-1,audio};
        rec2.updated=Date.now(); if(!old) scenes.push(rec2); await DB.put(rec2).catch(()=>{});
      }
      scenes=scenes.filter(x=>names.includes(x.name));  // on the Mac, the folder is the library
    }catch(e){ $('libInfo').textContent='Could not load scenes from takecheck: '+e.message; }
  };
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());micList()}).catch(()=>micList());
}

// ---- MIDI keyboard: C Back, D Replay, E Play, F Forward, G Stop, A Finish ----
// Any octave. Holding C, F or G works like holding the button.
(function(){
  if(!navigator.requestMIDIAccess) return;
  const keys={0:'back',2:'again',4:'go',5:'fwd',7:'stop',9:'finish'}, held={};
  const visible=id=>{const el=$(id);return el&&el.offsetParent!==null};
  function on(note){
    if($('finishBox').classList.contains('on')) return;
    let id=keys[note%12]; if(!id) return;
    if($('setup').classList.contains('on')){ if(id==='go') $('start').click(); return; }
    if(!visible(id)) return;
    held[note]=id;
    if(id==='back'||id==='fwd'||id==='stop') $(id).dispatchEvent(new PointerEvent('pointerdown'));  // may become a hold
    else $(id).click();
  }
  function off(note){
    const id=held[note]; delete held[note]; if(!id) return;
    if(id==='back'||id==='fwd'||id==='stop'){ $(id).dispatchEvent(new PointerEvent('pointerup')); $(id).click(); }  // a click after a hold is ignored
  }
  function msg(e){ const [st,note,vel]=e.data; const t=st&0xf0;
    if(t===0x90&&vel>0) on(note); else if(t===0x80||(t===0x90&&vel===0)) off(note); }
  navigator.requestMIDIAccess().then(acc=>{
    const hook=()=>{ const names=[]; acc.inputs.forEach(i=>{i.onmidimessage=msg;names.push(i.name)});
      $('midiInfo').textContent=names.length?`MIDI keyboard: ${names.join(', ')}. C Back · D Replay · E Play · F Forward · G Stop`+(window.TAKECHECK?' · A Finish':''):''; };
    hook(); acc.onstatechange=hook;
  }).catch(()=>{});
})();

if(store.get('size'))$('size').value=store.get('size');
applySize(); $('size').oninput=()=>{applySize();store.set('size',$('size').value)};

if(store.get('rate'))$('rate').value=store.get('rate');
$('rateV').textContent='×'+$('rate').value;
(async()=>{
  try{ await DB.open(); scenes=await DB.all()||[]; }catch(e){ scenes=[]; }
  if(TK) await tkLoadScenes();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  // First run after the update: bring over the scene that was open before.
  const legacy=store.get('src');
  if(!scenes.length&&legacy){ const sc={id:newId(),name:'My scene',src:legacy,me:store.get('me')||'',mark:-1,audio:{},updated:Date.now()}; scenes.push(sc); DB.put(sc).catch(()=>{}); }
  const want=store.get('cur'); select(scenes.find(x=>x.id===want)||scenes[0]||null);
  if(lines.length){show('run');render()}else show('setup');
})();
if(!TK&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
